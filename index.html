<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pure Majesty Pets — Ventes & Bénéfices</title>
<style>
  :root{
    --bg:#faf6f0; --card:#ffffff; --ink:#2b2118; --muted:#8a7a68;
    --gold:#c8a04b; --gold-d:#a9822f; --line:#ece2d3; --green:#3f7d54; --red:#b4553f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px}
  h1{font-size:22px;margin:0 0 2px;font-weight:700}
  h2{font-size:14px;margin:26px 0 10px;font-weight:700;text-transform:uppercase;
     letter-spacing:.06em;color:var(--gold-d)}
  h2 .n{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:12px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
        padding:7px 16px;font-size:13px;cursor:pointer;font-weight:600;font-family:inherit}
  .chip:hover{border-color:var(--gold)}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#fff}
  .cards{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:6px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;min-width:150px;flex:1}
  .kpi.hl{border-color:var(--gold);background:linear-gradient(180deg,#fffdf8,#fdf7ec)}
  .kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .kpi .val{font-size:22px;font-weight:700;margin-top:4px}
  .kpi .val.green{color:var(--green)}
  .kpi .val.gold{color:var(--gold-d)}
  .kpi .val.res{color:#5b6b8a}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th,td{padding:9px 12px;text-align:right;font-size:13px;border-bottom:1px solid var(--line)}
  th{background:#f3ebdd;color:var(--gold-d);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em}
  td:first-child,th:first-child{text-align:left}
  tbody tr:hover{background:#fbf7ef}
  tbody tr:last-child td{border-bottom:none}
  .tot{font-weight:700;background:#f7f0e2}
  .tot td{border-top:2px solid var(--gold)}
  .pos{color:var(--green)}
  .neg{color:var(--red)}
  .today td{background:#fdf6e6}
  .part{font-size:10px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;
         color:var(--muted);font-size:13px;text-align:center}
  .foot{color:var(--muted);font-size:11.5px;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<h1>Pure Majesty Pets — Ventes & Bénéfices</h1>
<div class="sub" id="sub"></div>

<div class="nav" id="nav"></div>

<h2 id="h-mtd"></h2>
<div class="cards" id="mtd"></div>

<h2 id="h-jour"></h2>
<table><thead><tr>
  <th>Date</th><th>Commandes</th><th>CA net USD</th><th>CA net CAD</th>
  <th>COGS CAD</th><th>Marge brute CAD</th><th>Remb. CAD</th><th>Bénéfice net CAD</th>
</tr></thead><tbody id="tb"></tbody><tfoot id="tf"></tfoot></table>

<h2 id="h-backlog"></h2>
<div class="cards" id="backlog-kpi"></div>
<div id="backlog-tbl"></div>

<h2>Mois passés <span class="n">— récapitulatif ; cliquez un mois en haut de page pour son détail jour par jour</span></h2>
<div id="passes"></div>

<div class="foot" id="foot"></div>

<script>
const D = {"rows": [["2026-07-06", 7, 144.18, 205.07, 65.97, 139.1, 0], ["2026-07-07", 6, 254.29, 361.3, 142.78, 218.52, 0], ["2026-07-08", 9, 350.23, 497.61, 197.69, 299.92, 0], ["2026-07-09", 6, 273.55, 387.57, 131.42, 256.15, 0], ["2026-07-11", 6, 212.91, 301.57, 109.49, 192.08, 0], ["2026-07-12", 5, 170.12, 240.41, 98.32, 142.1, 0], ["2026-07-13", 10, 550.21, 779.81, 317.72, 462.09, 0], ["2026-07-14", 13, 374.3, 526.41, 206.56, 319.85, 0], ["2026-07-15", 6, 234.7, 329.85, 140.31, 189.53, 0], ["2026-07-16", 6, 272.8, 382.98, 154.2, 228.78, 0], ["2026-07-17", 5, 189.26, 265.38, 97.55, 167.83, 0], ["2026-07-18", 7, 276.62, 387.87, 151.75, 236.13, 0], ["2026-07-19", 10, 385.7, 540.75, 151.72, 389.03, 0], ["2026-07-21", 9, 410.47, 579.18, 218.14, 361.04, 0], ["2026-07-22", 4, 195.06, 274.9, 88.29, 186.61, 0], ["2026-07-23", 8, 300.57, 423.59, 163.41, 260.18, 0], ["2026-07-24", 12, 385.55, 543.36, 198.37, 344.98, 0], ["2026-07-25", 5, 272.53, 384.13, 141.64, 242.49, 0], ["2026-07-26", 5, 148.73, 209.63, 76.27, 133.37, 0], ["2026-07-27", 7, 341.97, 481.98, 196.1, 285.87, 0], ["2026-07-28", 13, 376.71, 531.69, 130.92, 400.77, 0], ["2026-07-29", 5, 161.25, 227.27, 88.3, 138.97, 0], ["2026-07-30", 17, 665.4, 932.96, 305.74, 627.22, 0], ["2026-07-31", 12, 460.46, 645.61, 227.6, 418.01, 100.91], ["2026-08-01", 11, 455.63, 638.84, 184.25, 454.59, 0], ["2026-08-02", 9, 414.82, 581.62, 216.76, 364.85, 0], ["2026-08-03", 16, 701.27, 984.79, 366.62, 618.17, 0], ["2026-08-04", 14, 667.86, 939.28, 358.25, 581.03, 0], ["2026-08-05", 12, 573.99, 804.27, 314.42, 489.86, 0], ["2026-08-06", 5, 233.09, 325.02, 116.35, 208.67, 0], ["2026-08-07", 10, 419.11, 584.41, 221.92, 362.49, 33.45], ["2026-08-08", 15, 614.63, 857.04, 297.15, 559.89, 0], ["2026-08-09", 6, 301.55, 420.48, 137.91, 282.58, 0], ["2026-08-10", 12, 815.89, 1137.51, 392.9, 744.61, 50.16], ["2026-08-11", 11, 640.92, 892.16, 326.62, 565.54, 122.55], ["2026-08-12", 9, 426.54, 594.6, 215.21, 379.39, 142.75], ["2026-08-13", 11, 448.9, 625.77, 194.6, 431.16, 0], ["2026-08-14", 11, 771.48, 1074.83, 381.21, 693.62, 0], ["2026-08-15", 11, 661.51, 928.5, 401.15, 527.35, 0], ["2026-08-16", 7, 350.19, 491.53, 177.75, 313.77, 84.19], ["2026-08-17", 12, 764.88, 1060.74, 369.46, 691.28, 0], ["2026-08-18", 10, 522.81, 727.16, 268.71, 458.25, 106.76], ["2026-08-19", 16, 708.79, 983.45, 349.22, 634.23, 0], ["2026-08-20", 15, 1029.61, 1420.35, 536.65, 883.69, 0], ["2026-08-21", 12, 583.51, 803.35, 297.99, 505.36, 99.09], ["2026-08-22", 13, 725.77, 999.24, 342.23, 657.01, 35.69], ["2026-08-23", 11, 593.88, 817.77, 282.79, 534.98, 0], ["2026-08-24", 18, 1269.4, 1751.55, 624.85, 1126.7, 95.17], ["2026-08-25", 23, 1148.77, 1590.94, 516.43, 1074.51, 271.24], ["2026-08-26", 29, 1711.42, 2374.87, 759.62, 1615.25, 0], ["2026-08-27", 24, 1430.52, 1985.85, 661.63, 1324.22, 0], ["2026-08-28", 21, 1106.15, 1537.88, 532.65, 1005.23, 0], ["2026-08-29", 22, 1296.32, 1802.53, 589.82, 1212.71, 0], ["2026-08-30", 20, 1116.46, 1552.44, 541.29, 1011.14, 373.66], ["2026-08-31", 20, 1326.63, 1842.69, 574.37, 1268.32, 365.27], ["2026-09-01", 19, 1121.4, 1555.27, 501.45, 1053.82, 0], ["2026-09-02", 16, 1096.95, 1526.95, 544.23, 982.72, 0]], "moisCourant": "2026-09", "libelleMoisCourant": "Septembre 2026", "libelles": {"2026-07": "Juillet 2026", "2026-08": "Août 2026", "2026-09": "Septembre 2026"}, "debutHistorique": "2026-07-06", "build": "2026-09-02 22:00 (Est)", "fee": 0.039, "feeFixe": 0.3, "backlog": {"commandes": 124, "unites": 197, "coutUsd": 2595.82, "coutCad": 3613.38, "maj": "2026-09-02 22:00 (Est)", "produits": [{"titre": "Vet-Strength Liquid Collagen for Dogs", "unites": 177, "cout_unitaire_usd": 1.55, "cout_total_usd": 274.35}, {"titre": "Dog Yeast Infection Treatment Liquid", "unites": 20, "cout_unitaire_usd": 1.5, "cout_total_usd": 30.0}, {"titre": "Frais d'envoi Max (124 commandes)", "unites": 124, "cout_unitaire_usd": 18.48, "cout_total_usd": 2291.47}]}, "reserve": {"taux": 0.35, "depuisCommande": 1934, "parts": {"2026-09-01": 0.0}, "apresDefaut": false}};
const FEE = D.fee;
const FEE_FIXE = D.feeFixe || 0;
const RES = D.reserve || {taux:0, parts:{}};
const RESERVE = RES.taux || 0;   // taux de réserve sur les avoirs (règle utilisateur)
// part réservable d'un jour : 1 = toutes les commandes du jour sont >= depuisCommande, 0 = aucune
const part = r => (RES.parts && RES.parts[r[0]]!==undefined) ? RES.parts[r[0]] : (RES.apresDefaut ? 1 : 0);
const f = n => "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
// r[1]=commandes, r[3]=CA net CAD, r[5]=marge brute CAD ; taux CAD du jour = r[3]/r[2]
const remb = r => (r[6]||0);
const benef = r => r[5] - (FEE*r[3] + FEE_FIXE*r[1]*(r[2]?r[3]/r[2]:1)) - remb(r);
const ym = r => r[0].slice(0,7);

/* ---------- agrégation par mois ---------- */
const parMois = {};
D.rows.forEach(r=>{
  const k = ym(r);
  const m = parMois[k] || (parMois[k] = {jours:0,cmd:0,usd:0,cad:0,cogs:0,marge:0,remb:0,benef:0,resv:0});
  m.jours++; m.cmd+=r[1]; m.usd+=r[2]; m.cad+=r[3]; m.cogs+=r[4]; m.marge+=r[5]; m.remb+=remb(r); m.benef+=benef(r); m.resv+=benef(r)*part(r);
});

/* ---------- navigation par mois ---------- */
const dernier = D.rows[D.rows.length-1];
const moisListe = Object.keys(parMois).sort().reverse();   // récent en premier

document.getElementById("sub").textContent =
  `Dernier jour : ${dernier[0]} — ${dernier[1]} commandes. Historique depuis le ${D.debutHistorique}. Cliquez un mois pour voir chacun de ses jours.`;

const nav = document.getElementById("nav");
nav.innerHTML = moisListe.map(k=>
  `<button type="button" class="chip" data-m="${k}" id="chip-${k}">${D.libelles[k]}</button>`).join("");
nav.addEventListener("click", e=>{
  const b = e.target.closest("button[data-m]");
  if(b) render(b.dataset.m);
});

/* ---------- rendu d'un mois (KPI + tableau jour par jour) ---------- */
function render(k){
  moisListe.forEach(m=>document.getElementById("chip-"+m).classList.toggle("on", m===k));
  const cur = parMois[k];
  const jours = D.rows.filter(r=>ym(r)===k);
  const courant = k===D.moisCourant;
  const partiel = k===D.debutHistorique.slice(0,7) && D.debutHistorique.slice(8)!=="01"
    ? `, à partir du ${D.debutHistorique}` : "";

  document.getElementById("h-mtd").innerHTML =
    `${D.libelles[k]} — ${courant?"cumul du mois":"bilan du mois"} <span class="n">(${cur.jours} jour${cur.jours>1?"s":""} enregistré${cur.jours>1?"s":""}, ${cur.cmd} commandes${partiel})</span>`;

  document.getElementById("mtd").innerHTML = `
    <div class="kpi hl"><div class="lab">CA net du mois USD</div><div class="val">${f(cur.usd)}</div></div>
    <div class="kpi hl"><div class="lab">CA net du mois CAD</div><div class="val gold">${f(cur.cad)}</div></div>
    <div class="kpi"><div class="lab">COGS du mois CAD</div><div class="val">${f(cur.cogs)}</div></div>
    <div class="kpi"><div class="lab">Marge brute du mois CAD</div><div class="val">${f(cur.marge)}</div></div>
    <div class="kpi"><div class="lab">Remboursements du mois CAD</div><div class="val neg">${f(cur.remb)}</div></div>
    <div class="kpi"><div class="lab">Bénéfice net du mois CAD</div><div class="val green">${f(cur.benef)}</div></div>
    ${cur.resv>0 ? `<div class="kpi hl"><div class="lab">Fonds disponibles CAD</div><div class="val green">${f(cur.benef - cur.resv*RESERVE)}</div></div>
    <div class="kpi"><div class="lab">Réserve CAD (${(RESERVE*100).toFixed(0)} % des cmd &ge; #${RES.depuisCommande})</div><div class="val res">${f(cur.resv*RESERVE)}</div></div>` : ""}
    <div class="kpi"><div class="lab">Panier moyen CAD</div><div class="val">${f(cur.cmd?cur.cad/cur.cmd:0)}</div></div>`;

  document.getElementById("h-jour").innerHTML =
    `Détail jour par jour — ${D.libelles[k]} <span class="n">(du plus récent au plus ancien)</span>`;

  const tb = document.getElementById("tb");
  tb.innerHTML = "";
  jours.slice().reverse().forEach(r=>{
    const b = benef(r);
    tb.insertAdjacentHTML("beforeend",
     `<tr class="${r[0]===dernier[0]?"today":""}"><td>${r[0]}</td><td>${r[1]}</td><td>${f(r[2])}</td><td>${f(r[3])}</td>`+
     `<td>${f(r[4])}</td><td>${f(r[5])}</td><td class="${remb(r)>0?'neg':''}">${f(remb(r))}</td><td class="${b>=0?"pos":"neg"}">${f(b)}</td></tr>`);
  });
  document.getElementById("tf").innerHTML =
   `<tr class="tot"><td>TOTAL ${D.libelles[k]}</td><td>${cur.cmd}</td><td>${f(cur.usd)}</td>`+
   `<td>${f(cur.cad)}</td><td>${f(cur.cogs)}</td><td>${f(cur.marge)}</td><td>${f(cur.remb)}</td><td>${f(cur.benef)}</td></tr>`;
}
render(D.moisCourant);

/* ---------- backlog colis non expédiés ---------- */
if(D.backlog){
  const B = D.backlog;
  document.getElementById("h-backlog").innerHTML =
    `Colis non expédiés <span class="n">— commandes payées en attente d'envoi (relevé ${B.maj})</span>`;
  document.getElementById("backlog-kpi").innerHTML = `
    <div class="kpi hl"><div class="lab">Commandes à expédier</div><div class="val">${B.commandes}</div></div>
    <div class="kpi"><div class="lab">Unités</div><div class="val">${B.unites}</div></div>
    <div class="kpi hl"><div class="lab">Coût fournisseur à payer USD</div><div class="val gold">${f(B.coutUsd)}</div></div>
    <div class="kpi hl"><div class="lab">Coût fournisseur à payer CAD</div><div class="val gold">${f(B.coutCad)}</div></div>`;
  let h = `<table><thead><tr><th>Produit</th><th>Unités</th><th>Coût unitaire USD</th><th>Coût total USD</th></tr></thead><tbody>`;
  B.produits.forEach(p=>{
    const inc = p.cout_total_usd!==null;
    h += `<tr><td>${p.titre}</td><td>${p.unites}</td>`+
         `<td>${inc?f(p.cout_unitaire_usd):"⚠ inconnu"}</td>`+
         `<td>${inc?f(p.cout_total_usd):"exclu du total"}</td></tr>`;
  });
  h += `</tbody><tfoot><tr class="tot"><td>TOTAL à payer</td><td>${B.unites}</td><td>—</td><td>${f(B.coutUsd)}</td></tr></tfoot></table>`;
  document.getElementById("backlog-tbl").innerHTML = h;
}

/* ---------- mois passés ---------- */
const passes = Object.keys(parMois).filter(k=>k!==D.moisCourant).sort().reverse();
const box = document.getElementById("passes");
if(!passes.length){
  box.innerHTML = `<div class="empty">Aucun mois terminé pour l'instant — ${D.libelleMoisCourant} basculera ici automatiquement le 1<sup>er</sup> du mois prochain.</div>`;
}else{
  let tot={cmd:0,usd:0,cad:0,cogs:0,marge:0,remb:0,benef:0};
  let html = `<table><thead><tr><th>Mois</th><th>Jours</th><th>Commandes</th><th>CA net USD</th>`+
             `<th>CA net CAD</th><th>COGS CAD</th><th>Marge brute CAD</th><th>Remb. CAD</th><th>Bénéfice net CAD</th></tr></thead><tbody>`;
  passes.forEach(k=>{
    const m=parMois[k];
    tot.cmd+=m.cmd; tot.usd+=m.usd; tot.cad+=m.cad; tot.cogs+=m.cogs; tot.marge+=m.marge; tot.remb+=m.remb; tot.benef+=m.benef;
    const partiel = k===D.debutHistorique.slice(0,7) && D.debutHistorique.slice(8)!=="01"
      ? `<span class="part"> (à partir du ${D.debutHistorique})</span>` : "";
    html += `<tr><td>${D.libelles[k]}${partiel}</td><td>${m.jours}</td><td>${m.cmd}</td><td>${f(m.usd)}</td>`+
            `<td>${f(m.cad)}</td><td>${f(m.cogs)}</td><td>${f(m.marge)}</td><td class="neg">${f(m.remb)}</td><td class="pos">${f(m.benef)}</td></tr>`;
  });
  html += `</tbody><tfoot><tr class="tot"><td>TOTAL mois clos</td><td>—</td><td>${tot.cmd}</td><td>${f(tot.usd)}</td>`+
          `<td>${f(tot.cad)}</td><td>${f(tot.cogs)}</td><td>${f(tot.marge)}</td><td>${f(tot.remb)}</td><td>${f(tot.benef)}</td></tr></tfoot></table>`;
  box.innerHTML = html;
}

document.getElementById("foot").innerHTML =
 "Bénéfice net = marge brute − frais de transaction Stripe − remboursements (perte nette : aucun retour marchandise ; budget pub supposé 0). "+
 "COGS = coût fournisseur DSers tout compris ; les produits sans coût DSers connu en sont exclus, la marge est donc une borne haute.<br>"+
 "Conversion CAD au taux mid-market relevé le jour de chaque run. Source ventes : Shopify (ShopifyQL, fenêtre 24 h glissante clôturée à 22 h Est).<br>"+
 (RES.depuisCommande ? `Réserve = ${(RESERVE*100).toFixed(0)} % du bénéfice net généré par les commandes à partir de la n° ${RES.depuisCommande} ; fonds disponibles = le reste.<br>` : "")+
 "Dernière mise à jour : " + D.build + ".";
</script>
</body>
</html>
